<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アストラ ゲームス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #d9d4cb; /* 取説を並べた床っぽい生成り色 */
    font-family: "DotGothic16","Hiragino Kaku Gothic ProN",monospace;
    color: #222;
    min-height: 100vh;
    padding: 26px 14px 60px;
  }
  header { text-align: center; margin-bottom: 26px; }
  header h1 {
    display: inline-block;
    margin: 0;
    padding: 8px 26px;
    font-size: 26px;
    letter-spacing: 6px;
    color: #fff;
    background: #b3342a;
    border: 3px solid #7c1f18;
    box-shadow: 4px 4px 0 rgba(0,0,0,.25);
  }
  header p { margin: 12px 0 0; font-size: 13px; letter-spacing: 3px; color: #6b655c; }

  .shelf {
    display: flex;
    flex-wrap: wrap;
    gap: 26px;
    justify-content: center;
    align-items: flex-start;
    max-width: 1080px;
    margin: 0 auto;
  }

  /* ディスクシステム取説風パッケージ */
  a.pkg {
    display: block;
    width: 270px;
    text-decoration: none;
    color: #222;
    background: #f4efe3; /* 紙 */
    border: 2px solid #b9b2a4;
    box-shadow: 5px 6px 0 rgba(0,0,0,.22);
    transition: transform .12s, box-shadow .12s;
    transform: rotate(-.6deg);
  }
  a.pkg:nth-child(even) { transform: rotate(.7deg); }
  a.pkg:hover { transform: rotate(0deg) translateY(-6px); box-shadow: 7px 10px 0 rgba(0,0,0,.28); }

  .pkgTop {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 9px;
    font-size: 10px;
    letter-spacing: 1px;
    color: #5c564c;
    border-bottom: 2px solid #b3342a;
  }
  .pkgTop .sys { display: flex; align-items: center; gap: 6px; }
  .pkgTop .sysMark {
    width: 16px; height: 16px;
    background: #e8a33c;
    border: 2px solid #7c5a1c;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 9px; color: #7c3f14;
  }
  .pkgBand {
    margin: 10px 10px 0;
    background: #b3342a;
    color: #fff;
    padding: 7px 10px 6px;
    border: 2px solid #7c1f18;
  }
  .pkgBand .t { font-size: 22px; letter-spacing: 4px; line-height: 1.1; }
  .pkgBand .s { font-size: 10px; letter-spacing: 2px; margin-top: 3px; color: #ffd9b0; }
  .pkgArt {
    margin: 10px 10px;
    border: 2px solid #b9b2a4;
    background: #6c7a5b;
    display: block;
  }
  .pkgArt canvas { display: block; width: 100%; image-rendering: pixelated; }
  .pkgManual { margin: 0 10px; font-size: 12px; letter-spacing: 3px; }
  .pkgBottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px 9px;
    margin-top: 8px;
  }
  .pkgBottom .logo {
    font-size: 12px;
    letter-spacing: 2px;
    color: #fff;
    background: #3a3a3a;
    padding: 2px 10px;
    border-radius: 8px;
  }
  .pkgBottom .play {
    font-size: 12px;
    letter-spacing: 2px;
    color: #b3342a;
    font-weight: 700;
  }
</style>
</head>
<body>
<header>
  <h1>アストラ ゲームス</h1>
  <p>あそびたい パッケージを えらんでね</p>
</header>

<div class="shelf">

  <a class="pkg" href="./momotaro/">
    <div class="pkgTop">
      <span class="sys"><span class="sysMark">A</span>アストラ ゲーム システム</span>
      <span class="code">AGS-MMT</span>
    </div>
    <div class="pkgBand">
      <div class="t">モモタロウ</div>
      <div class="s">アクションローグライク</div>
    </div>
    <div class="pkgArt"><canvas id="artMomotaro" width="120" height="88"></canvas></div>
    <div class="pkgManual">とりあつかいせつめいしょ</div>
    <div class="pkgBottom">
      <span class="logo">ASTRA</span>
      <span class="play">▶ あそぶ</span>
    </div>
  </a>

</div>

<script>
// パッケージ表紙のドット絵(ゲーム本編のスプライトを再現)
(() => {
  const cv = document.getElementById('artMomotaro');
  const x = cv.getContext('2d');
  const W = 120, H = 88;
  // 空と地面
  x.fillStyle = '#7fb5cf'; x.fillRect(0, 0, W, 34);
  x.fillStyle = '#a69164'; x.fillRect(0, 34, W, H - 34);
  // 太陽
  x.fillStyle = '#ffd94a'; x.fillRect(12, 8, 8, 8);
  x.fillRect(10, 11, 12, 2); x.fillRect(15, 6, 2, 12);
  // 鬼ヶ島(遠景)
  x.fillStyle = '#3d5747';
  x.beginPath(); x.arc(96, 34, 18, Math.PI, 0); x.closePath(); x.fill();
  x.beginPath(); x.moveTo(86,22); x.lineTo(92,22); x.lineTo(89,10); x.closePath(); x.fill();
  x.beginPath(); x.moveTo(100,22); x.lineTo(106,22); x.lineTo(103,10); x.closePath(); x.fill();
  // 波
  x.fillStyle = '#5f89a8';
  for (let i = 0; i < 6; i++) x.fillRect(70 + i*9, 32, 6, 2);
  // 松の木
  x.fillStyle = '#7a5a2e'; x.fillRect(16, 52, 4, 10);
  x.fillStyle = '#63b56b';
  x.fillRect(10, 46, 16, 5); x.fillRect(13, 41, 12, 5);
  // ヒーロー(たろう): 本編スプライト準拠
  const hx = 52, hy = 76;
  x.fillStyle = '#f4f4f4'; x.fillRect(hx-9, hy-30, 18, 22);   // 体
  x.fillStyle = '#ffdcb8'; x.fillRect(hx-7, hy-40, 14, 12);   // 顔
  x.fillStyle = '#c93a3a'; x.fillRect(hx-7, hy-40, 14, 4);    // 鉢巻
  x.fillStyle = '#202020'; x.fillRect(hx+1, hy-34, 3, 3);     // 目
  x.fillRect(hx-8, hy-8, 6, 8); x.fillRect(hx+2, hy-8, 6, 8); // 脚
  // 刀
  x.fillStyle = '#d9e4ea'; x.fillRect(hx+9, hy-34, 3, 16);
  x.fillStyle = '#7a5a2e'; x.fillRect(hx+8, hy-19, 5, 4);
  // 相棒のモモ
  x.fillStyle = '#f2a0b5'; x.fillRect(hx-26, hy-24, 12, 11);
  x.fillStyle = '#e57d98'; x.fillRect(hx-26, hy-24, 12, 3);
  x.fillStyle = '#63b56b'; x.fillRect(hx-21, hy-27, 3, 4);    // 葉っぱ
  x.fillStyle = '#202020'; x.fillRect(hx-22, hy-20, 2, 2); x.fillRect(hx-18, hy-20, 2, 2);
  // 敵の雑魚
  x.fillStyle = '#e15b5b'; x.fillRect(92, 58, 14, 12);
  x.fillStyle = '#ffdcb8'; x.fillRect(94, 52, 10, 7);
  x.fillStyle = '#f0c95c'; x.fillRect(91, 50, 16, 3);
  x.fillStyle = '#202020'; x.fillRect(96, 54, 2, 2);
  x.fillRect(93, 70, 4, 5); x.fillRect(100, 70, 4, 5);
})();
</script>
</body>
</html>
