<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>巨大雑魚デモ(デザイン・動き確認用)</title>
<style>
  body { margin:0; background:#101010; overflow:hidden; font-family:"DotGothic16","Hiragino Kaku Gothic ProN",monospace; }
  canvas { display:block; width:100vw; height:100vh; image-rendering:pixelated; }
  #info {
    position:fixed; left:12px; top:10px; color:#f4f4f4; font-size:14px; line-height:1.7;
    background:rgba(0,0,0,.55); padding:8px 12px; border:2px solid rgba(255,255,255,.3); pointer-events:none;
  }
</style>
</head>
<body>
<div id="info">巨大雑魚デモ — 移動: WASD / 矢印<br>その場から動かず、岩を頭上に持ち上げてから放物線で投げてくる(着地点に影の予告)。<br>着地で岩塊が上に跳ねてから落ち、凹み跡が残る。</div>
<canvas id="cv"></canvas>
<script>
(() => {
  const cv=document.getElementById('cv');
  const ctx=cv.getContext('2d');
  let W=innerWidth,H=innerHeight;
  function resize(){ W=innerWidth;H=innerHeight;cv.width=W;cv.height=H; }
  resize(); addEventListener('resize',resize);

  const FLOOR=0.18;
  const keys=new Set();
  addEventListener('keydown',e=>keys.add(e.key.length===1?e.key.toLowerCase():e.key));
  addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));

  const hero={x:W*.25,y:H*.6,facing:1,hurt:0,kvx:0,kvy:0};
  const floatTexts=[];
  // 巨大雑魚: 通常雑魚(34×58)の6倍。その場から動かない
  const giant={x:W*.72,y:H*.66,w:34*6,h:58*6,facing:-1,state:'idle',t:0,rockCd:120,hurt:0};
  const rocks=[],shards=[],craters=[],particles=[];
  let time=0;

  // ドット絵の岩(16×16)
  const ROCK_PAL={o:'#3f3a34',b:'#8a8178',l:'#b3aa9c',d:'#5f584f'};
  const ROCK_GRID=[
    '....oooooooo....',
    '..oobbbbbbbboo..',
    '.obbllbbbbbbbbo.',
    '.oblllbbbbbbdbo.',
    'obllllbbbbbbbdbo',
    'oblllbbbbbbbbdbo',
    'obllbbbbbdbbbbbo',
    'obbbbbbbdbbbbbbo',
    'obbbbbbdbbbbbbdo',
    'obbbbbdbbbbbbddo',
    'obdbbbbbbbbbdddo',
    'obddbbbbbbbdddbo',
    '.obddbbbbbdddbo.',
    '.obbdddddddddbo.',
    '..oobbbbbbbboo..',
    '....oooooooo....',
  ];
  function drawPixelRock(cx,cy,r,rot90){
    const n=ROCK_GRID.length, cell=(r*2)/n;
    ctx.save();
    ctx.translate(Math.round(cx),Math.round(cy));
    ctx.rotate((rot90||0)*Math.PI/2);
    for(let gy=0;gy<n;gy++){
      const row=ROCK_GRID[gy];
      for(let gx=0;gx<n;gx++){
        const ch=row[gx];
        if(ch==='.')continue;
        ctx.fillStyle=ROCK_PAL[ch];
        ctx.fillRect(-r+gx*cell-.5,-r+gy*cell-.5,cell+1,cell+1);
      }
    }
    ctx.restore();
  }

  // ドット絵の岩塊(破片・5×5を3種)
  const SHARD_GRIDS=[
    ['.oo..','obblo','oblbo','obbdo','.ooo.'],
    ['..o..','.oblo','obbbo','.oddo','..oo.'],
    ['.ooo.','oblbo','obbdo','obddo','.ooo.'],
  ];
  function drawPixelChunk(s){
    const grid=SHARD_GRIDS[s.variant], n=5, cell=Math.max(3,Math.round(s.r*2/n));
    const rot=(Math.floor(time/8)+s.spin)%4; // 90度刻みで転がる
    ctx.save();
    ctx.translate(Math.round(s.gx),Math.round(s.gy-s.z));
    ctx.rotate(rot*Math.PI/2);
    const off=-cell*n/2;
    for(let gy=0;gy<n;gy++)for(let gx=0;gx<n;gx++){
      const ch=grid[gy][gx];
      if(ch==='.')continue;
      ctx.fillStyle=ROCK_PAL[ch];
      ctx.fillRect(off+gx*cell,off+gy*cell,cell,cell);
    }
    ctx.restore();
  }

  // ドット絵の凹み跡(16×8)
  const CRATER_PAL={r:'#8d7b5f',m:'#5f5140',h:'#3a3128',d:'#262019'};
  const CRATER_GRID=[
    '....rrrrrrrr....',
    '..rrmmmmmmmmrr..',
    '.rmhhhhhhhhhhmr.',
    'rmhhddddddddhhmr',
    'rmhhddddddddhhmr',
    '.rmhhhhhhhhhhmr.',
    '..rrmmmmmmmmrr..',
    '....rrrrrrrr....',
  ];
  function drawPixelCrater(cr){
    const cols=16, rows=8;
    const cellW=cr.r*2/cols, cellH=cr.r*.84/rows;
    ctx.save();
    ctx.translate(Math.round(cr.x-cr.r),Math.round(cr.y-cr.r*.42));
    for(let gy=0;gy<rows;gy++)for(let gx=0;gx<cols;gx++){
      const ch=CRATER_GRID[gy][gx];
      if(ch==='.')continue;
      ctx.fillStyle=CRATER_PAL[ch];
      ctx.fillRect(gx*cellW-.5,gy*cellH-.5,cellW+1,cellH+1);
    }
    ctx.restore();
  }

  // ドット絵の影(楕円をピクセル格子で塗る)
  function drawPixelEllipse(cx,cy,rx,ry,color,alpha,cell){
    const cols=Math.max(3,Math.ceil(rx*2/cell)), rows=Math.max(2,Math.ceil(ry*2/cell));
    ctx.globalAlpha=alpha;
    ctx.fillStyle=color;
    const x0=Math.round(cx-cols*cell/2), y0=Math.round(cy-rows*cell/2);
    for(let gy=0;gy<rows;gy++)for(let gx=0;gx<cols;gx++){
      const nx=(gx+.5)/cols*2-1, ny=(gy+.5)/rows*2-1;
      if(nx*nx+ny*ny<=1) ctx.fillRect(x0+gx*cell,y0+gy*cell,cell,cell);
    }
    ctx.globalAlpha=1;
  }

  const easeOut=t=>1-(1-t)*(1-t);
  function heldRockPos(){
    const r=giant.w*.5;
    const raise=giant.state==='lift'?easeOut(giant.t/48):1;
    const x0=giant.x+giant.facing*giant.w*.7, y0=giant.y-r*.4; // 足元の岩を
    const x1=giant.x, y1=giant.y-giant.h-r*.35;                // 頭上へ持ち上げる
    const shake=giant.state==='hold'?Math.sin(time*.8)*3:0;
    return {x:x0+(x1-x0)*raise+shake,y:y0+(y1-y0)*raise,r};
  }

  function throwRock(){
    const T=80; // 約1.3秒の滞空
    const g=.22;
    const hp=heldRockPos();
    const sx=hp.x, sy=hp.y;
    const tx=hero.x, ty=hero.y;
    rocks.push({x:sx,y:sy,vx:(tx-sx)/T,vy:(ty-sy)/T-g*(T+1)/2,g,r:hp.r,life:T,T,tx,ty,age:0});
  }
  function shatter(rk){
    craters.push({x:rk.tx,y:rk.ty,r:rk.r*.9});
    if(craters.length>8)craters.shift();
    // 直撃: 大ダメージ+ふっとばし
    const hd=Math.hypot(hero.x-rk.tx,hero.y-rk.ty);
    if(hd<rk.r*1.05){
      hero.hurt=48;
      const a=hd>1?Math.atan2(hero.y-rk.ty,hero.x-rk.tx):Math.PI;
      hero.kvx=Math.cos(a)*22;
      hero.kvy=Math.sin(a)*14;
      floatTexts.push({x:hero.x,y:hero.y-70,text:'直撃!',life:55});
    }
    for(let i=0;i<10;i++){
      const a=Math.PI*2*i/10+Math.random()*.3;
      const spd=5+Math.random()*5.5;
      // 一回上に跳ね上がってから落ちる(zが高さ、vzが上向き初速)
      shards.push({gx:rk.tx,gy:rk.ty,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd*.45,
        z:15,vz:5+Math.random()*4,r:20,variant:i%3,spin:i%4});
    }
    for(let i=0;i<26;i++){
      const a=Math.random()*Math.PI*2, s=Math.random()*6;
      particles.push({x:rk.tx,y:rk.ty,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:20+Math.random()*14,color:Math.random()<.5?'#a49a8e':'#8a8178'});
    }
  }

  function update(){
    time++;
    // ヒーロー移動
    let dx=0,dy=0;
    if(keys.has('a')||keys.has('ArrowLeft'))dx--;
    if(keys.has('d')||keys.has('ArrowRight'))dx++;
    if(keys.has('w')||keys.has('ArrowUp'))dy--;
    if(keys.has('s')||keys.has('ArrowDown'))dy++;
    const len=Math.hypot(dx,dy)||1;
    hero.x=Math.max(30,Math.min(W-30,hero.x+dx/len*5+hero.kvx));
    hero.y=Math.max(H*FLOOR+60,Math.min(H-20,hero.y+dy/len*3.6+hero.kvy));
    hero.kvx*=.86; hero.kvy*=.86;
    if(dx)hero.facing=Math.sign(dx);
    if(hero.hurt>0)hero.hurt--;

    // 巨大雑魚: その場から動かず、持ち上げ→構え→投擲
    giant.facing=Math.sign(hero.x-giant.x)||giant.facing;
    if(giant.state==='idle'){
      giant.rockCd--;
      if(giant.rockCd<=0){ giant.state='lift'; giant.t=0; }
    }else if(giant.state==='lift'){
      if(++giant.t>=48){ giant.state='hold'; giant.t=0; }
    }else if(giant.state==='hold'){
      if(++giant.t>=20){ throwRock(); giant.state='idle'; giant.rockCd=240; }
    }
    if(giant.hurt>0)giant.hurt--;

    // 岩
    for(const rk of rocks){
      rk.vy+=rk.g;
      rk.x+=rk.vx; rk.y+=rk.vy;
      rk.age++;
      rk.life--;
      if(rk.life<=0){ shatter(rk); }
    }
    for(let i=rocks.length-1;i>=0;i--) if(rocks[i].life<=0) rocks.splice(i,1);

    // 岩塊(破片): 上に跳ねてから落下。ヒーローにも巨大雑魚にも当たる
    for(const s of shards){
      s.gx+=s.vx; s.gy+=s.vy;
      s.z+=s.vz; s.vz-=.35;
      const px=s.gx, py=s.gy-s.z;
      if(Math.hypot(px-hero.x,py-(hero.y-25))<36 && hero.hurt<=0){
        hero.hurt=30;
        hero.kvx=s.vx*1.5; hero.kvy=s.vy*1.5; // 岩塊にもふっとばされる
        s.z=-1;
      }
      if(Math.hypot(px-giant.x,py-(giant.y-giant.h*.4))<giant.w*.45 && giant.hurt<=0){ giant.hurt=20; s.z=-1; }
      if(s.z<=0){
        s.dead=true;
        for(let i=0;i<3;i++){
          const a=Math.random()*Math.PI*2;
          particles.push({x:s.gx,y:s.gy,vx:Math.cos(a)*1.5,vy:-Math.random()*1.5,life:12+Math.random()*8,color:'#a49a8e'});
        }
      }
    }
    for(let i=shards.length-1;i>=0;i--) if(shards[i].dead) shards.splice(i,1);
    for(const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vy+=.2; p.life--; }
    for(let i=particles.length-1;i>=0;i--) if(particles[i].life<=0) particles.splice(i,1);
    for(const t of floatTexts){ t.y-=.8; t.life--; }
    for(let i=floatTexts.length-1;i>=0;i--) if(floatTexts[i].life<=0) floatTexts.splice(i,1);
  }

  function drawFighterBody(f,scale,color,hatColor,armRaise,noLegs){
    ctx.save();
    ctx.translate(Math.round(f.x),Math.round(f.y));
    ctx.scale(f.facing*scale,scale);
    if(f.hurt>0&&Math.floor(time/3)%2){ ctx.globalAlpha=.6; }
    const bodyColor=f.hurt>0?'#ffffff':color;
    if(armRaise!=null){ // 腕(持ち上げモーション用): 下げ→上げを補間
      ctx.fillStyle=bodyColor;
      const ay=-38-26*armRaise;
      ctx.fillRect(-17,ay,4,22);
      ctx.fillRect(13,ay,4,22);
    }
    ctx.fillStyle=bodyColor;
    ctx.fillRect(-13,-43,26,noLegs?43:32);  // 体(脚なしは接地まで)
    ctx.fillStyle='#ffdcb8';
    ctx.fillRect(-10,-57,20,18);            // 顔
    if(hatColor){ ctx.fillStyle=hatColor; ctx.fillRect(-16,-60,32,6); } // 笠
    ctx.fillStyle='#202020';
    ctx.fillRect(2,-50,4,4);                // 目
    if(!noLegs){
      ctx.fillStyle='#202020';
      ctx.fillRect(-11,-10,8,12);           // 脚
      ctx.fillRect(3,-10,8,12);
    }
    ctx.restore();
  }

  function render(){
    // 背景
    ctx.fillStyle='#6c7a5b'; ctx.fillRect(0,0,W,H*FLOOR);
    ctx.fillStyle='#a69164'; ctx.fillRect(0,H*FLOOR,W,H);
    ctx.strokeStyle='rgba(55,35,20,.22)';
    for(let x=0;x<W;x+=90){ ctx.beginPath();ctx.moveTo(x,H*FLOOR);ctx.lineTo(x,H);ctx.stroke(); }

    // 凹み跡(クレーター・ドット絵)
    for(const cr of craters){
      drawPixelCrater(cr);
    }

    // 着地予告の影(岩が近づくほど濃く・大きく / ドット絵)
    for(const rk of rocks){
      const prog=1-rk.life/rk.T;
      drawPixelEllipse(rk.tx,rk.ty,rk.r*(.5+.5*prog),rk.r*.4*(.5+.5*prog),'#2b2320',.15+.35*prog,9);
    }

    // ヒーロー(白・鉢巻)
    drawFighterBody(hero,1,'#f4f4f4',null,null);
    ctx.save();
    ctx.translate(Math.round(hero.x),Math.round(hero.y));
    ctx.scale(hero.facing,1);
    ctx.fillStyle='#c93a3a'; ctx.fillRect(-10,-57,20,5); // 鉢巻
    ctx.restore();

    // 巨大雑魚(通常敵と同じ見た目の6倍)+持ち上げ中の岩
    const armRaise=giant.state==='lift'?easeOut(giant.t/48):giant.state==='hold'?1:0;
    drawFighterBody(giant,6,'#e15b5b','#f0c95c',armRaise,true);
    if(giant.state==='lift'||giant.state==='hold'){
      const hp=heldRockPos();
      drawPixelRock(hp.x,hp.y,hp.r,0);
    }

    // 飛んでいる岩(ドット絵・90度刻みで回転)
    for(const rk of rocks){
      drawPixelRock(rk.x,rk.y,rk.r,Math.floor(rk.age/9)%4);
    }

    // 岩塊(破片): 地面の影(ドット絵)+跳ねる岩塊
    for(const s of shards){
      drawPixelEllipse(s.gx,s.gy,s.r*.8,s.r*.32,'#2b2320',.2,3);
      drawPixelChunk(s);
    }
    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life/30);
      ctx.fillStyle=p.color;
      ctx.fillRect(p.x-3,p.y-3,6,6);
    }
    ctx.globalAlpha=1;
    for(const t of floatTexts){
      ctx.globalAlpha=Math.min(1,t.life/20);
      ctx.font='bold 30px "DotGothic16",monospace';
      ctx.textAlign='center';
      ctx.strokeStyle='#3a0d0d'; ctx.lineWidth=5; ctx.strokeText(t.text,t.x,t.y);
      ctx.fillStyle='#ff5a3c'; ctx.fillText(t.text,t.x,t.y);
    }
    ctx.globalAlpha=1;
  }

  // 本編と同じ60fps固定ステップ(高リフレッシュレート環境で倍速にならないように)
  let paused=false, acc=0, last=performance.now();
  window.__demo={rocks,shards,craters,hero,giant,
    setPause:v=>{paused=v;}, step:n=>{for(let i=0;i<n;i++)update();}};
  function loop(now){
    const dt=Math.min(100,now-last); last=now;
    if(!paused){
      acc+=dt;
      let steps=0;
      while(acc>=1000/60&&steps<4){ update(); acc-=1000/60; steps++; }
      if(acc>=1000/60)acc=0;
    }
    ctx.clearRect(0,0,W,H);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
